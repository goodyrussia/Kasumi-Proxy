[package]
name = "kasumi-codegen"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Regenerates the frontend's generated TypeScript (bindings/schemas/defaults) from the Rust types."

[dependencies]
serde = "1"
serde_json = "1"
specta = { version = "2.0.0-rc.25", features = ["derive"] }
specta-typescript = "0.0.12"
specta-serde = "0.0.12"
specta-zod = "0.0.3"
strum = { version = "0.26", features = ["derive"] }

kasumi-core = { path = "../kasumi-core" }
kasumi-backend = { path = "../kasumi-backend" }
