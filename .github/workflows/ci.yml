name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  # ── One cheap job computes which areas a PR touches; the heavier jobs gate on
  #    its outputs so an irrelevant one never starts (no runner spun up). A
  #    skipped job doesn't satisfy a required status check, so the single
  #    required check is the `ci` aggregator at the bottom. ──
  changes:
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.detect.outputs.frontend }}
      rust: ${{ steps.detect.outputs.rust }}
      android: ${{ steps.detect.outputs.android }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changes
        id: detect
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
            head="${{ github.event.pull_request.head.sha }}"
          else
            base="${{ github.event.before }}"
            head="${{ github.sha }}"
          fi
          # No usable base (first push, force-push, shallow clone) → run everything.
          if [ -z "$base" ] || ! git cat-file -e "$base" 2>/dev/null; then
            {
              echo "frontend=true"
              echo "rust=true"
              echo "android=true"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi
          files=$(git diff --name-only "$base...$head")
          match() { printf '%s\n' "$files" | grep -Eq "$1"; }
          fe=false; rs=false; an=false
          match '^(frontend/|package\.json|bun\.lock|biome\.json)' && fe=true
          match '^(crates/|Cargo\.(toml|lock)|rust-toolchain\.toml)' && rs=true
          match '^(crates/|module/|scripts/|frontend/|Cargo\.(toml|lock)|rust-toolchain\.toml|\.github/workflows/)' && an=true
          {
            echo "frontend=$fe"
            echo "rust=$rs"
            echo "android=$an"
          } >> "$GITHUB_OUTPUT"

  # ── Frontend: bun workspace (lockfile at the repo root), build, tests, i18n,
  #    biome (format + lint). ──
  frontend:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Format + lint (biome)
        run: bunx biome check

      - name: Build (tsc + vite)
        working-directory: frontend
        run: bun run build

      - name: Unit tests
        working-directory: frontend
        run: bunx vitest run

      - name: i18n dictionaries
        run: bun run frontend/scripts/check-i18n.ts

  # ── Rust workspace: fmt, clippy, tests, and generated-bindings drift. ──
  rust:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: cargo-registry-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            cargo-registry-${{ runner.os }}-

      - name: Cache cargo build
        uses: actions/cache@v4
        with:
          path: target
          key: cargo-target-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}-${{ hashFiles('rust-toolchain.toml') }}
          restore-keys: |
            cargo-target-${{ runner.os }}-

      - name: fmt
        run: cargo fmt --all --check

      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: test
        run: cargo test --workspace

      - name: generated bindings drift
        run: cargo run -q -p kasumi-codegen -- --check

  # ── Android module: build the pinned Xray core, the arm64 daemon, the web UI,
  #    and a complete module zip — the exact release pipeline, smoke-checked. ──
  android:
    needs: changes
    if: needs.changes.outputs.android == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go (builds the pinned Xray core from source)
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      # rust-toolchain.toml pins the exact Rust version; rustup resolves it inside
      # the checkout, so the Android target must be added to THAT toolchain — the
      # one `targets:` above provisioned may not be the one cargo actually uses.
      - name: Add the Android target to the pinned toolchain
        run: rustup target add aarch64-linux-android

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27c

      - name: Export NDK_ROOT
        run: echo "NDK_ROOT=$ANDROID_NDK_HOME" >> "$GITHUB_ENV"

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install UI dependencies
        run: bun install --frozen-lockfile

      - name: Lint module + build scripts
        run: shellcheck -s sh module/*.sh && shellcheck scripts/*.sh

      # The harness skips geo-dependent cases when geoip.dat is absent; stage the
      # upstream geo data so those cases (fake-dns, geoip/geosite rules) validate too.
      - name: Stage geoip/geosite data
        run: |
          mkdir -p bin
          curl -fsSL https://github.com/v2fly/geoip/releases/latest/download/geoip.dat -o bin/geoip.dat
          curl -fsSL https://github.com/v2fly/domain-list-community/releases/latest/download/dlc.dat -o bin/geosite.dat

      - name: Validate generated configs against the pinned core
        run: scripts/check-binary-compat.sh

      - name: Package the module zip
        run: scripts/package-release.sh

      - name: Verify zip contents
        run: |
          set -euo pipefail
          zip=$(ls build/*.zip)
          echo "→ $zip"
          list=$(unzip -Z1 "$zip")
          for f in module.prop customize.sh service.sh action.sh uninstall.sh \
                   bin/arm64-v8a/xray bin/arm64-v8a/kasumi-proxy \
                   bin/arm64-v8a/tun2socks bin/arm64-v8a/hev-socks5-tunnel \
                   webroot/index.html; do
            echo "$list" | grep -qx "$f" || { echo "❌ missing: $f"; exit 1; }
          done
          # Arm64-only: no other ABI, no sing-box anywhere.
          if echo "$list" | grep -qE 'bin/(x86_64|armeabi|arm/)|sing-box'; then
            echo "❌ unexpected ABI or sing-box payload"; exit 1
          fi
          ls -lh "$zip"

      - name: Upload the module zip
        uses: actions/upload-artifact@v4
        with:
          name: kasumi-proxy-module
          path: build/*.zip
          retention-days: 14

  # ── The single required status check. It always runs and aggregates the
  #    gated jobs above: a skipped area (its files weren't touched) is fine;
  #    only a real failure or cancellation fails CI. ──
  ci:
    needs: [changes, frontend, rust, android]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Verify no required job failed
        run: |
          results="${{ join(needs.*.result, ' ') }}"
          echo "job results: $results"
          for r in $results; do
            if [ "$r" = "failure" ] || [ "$r" = "cancelled" ]; then
              echo "a CI job did not pass"
              exit 1
            fi
          done
          echo "all CI jobs passed or were skipped"
