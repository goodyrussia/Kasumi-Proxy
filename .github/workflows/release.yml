name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: 'Version bump type'
        type: choice
        options: [patch, minor, major]
        default: minor
      skip_bump:
        description: 'Skip version bump (release the current version)'
        type: boolean
        default: false

permissions:
  contents: write

# Never run two releases at once (they both bump module.prop).
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # ── One job: gate, bump, build the module zip, commit + tag, publish. The
  #    heavy lifting is the same steps CI runs (core → daemon → webroot → zip),
  #    so a release can only fail where CI would have failed. ──
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go (builds the pinned Xray core from source)
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
          components: rustfmt, clippy

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27c

      - name: Export NDK_ROOT
        run: echo "NDK_ROOT=$ANDROID_NDK_HOME" >> "$GITHUB_ENV"

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install UI dependencies
        run: bun install --frozen-lockfile

      # ── Gate: the release must not ship something CI would reject. ──
      - name: Gate — frontend lint/tests + config-compat against the pinned core
        run: |
          bunx biome check
          bun run frontend/scripts/check-i18n.ts
          ( cd frontend && bunx vitest run )
          scripts/check-binary-compat.sh

      - name: Bump version
        id: bump
        run: |
          if [ "${{ inputs.skip_bump }}" = "true" ]; then
            version=$(grep -m1 '^version=' module/module.prop | cut -d= -f2)
          else
            version=$(scripts/bump-version.sh ${{ inputs.bump }})
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "releasing $version"

      - name: Regenerate update.json + changelog
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          scripts/gen-update-json.sh
          scripts/gen-changelog.sh "${{ steps.bump.outputs.version }}"

      - name: Package the module zip
        run: scripts/package-release.sh

      - name: Verify zip contents
        run: |
          set -euo pipefail
          zip=$(ls build/*.zip)
          list=$(unzip -Z1 "$zip")
          for f in module.prop customize.sh service.sh action.sh uninstall.sh \
                   bin/arm64-v8a/xray bin/arm64-v8a/kasumi-proxy \
                   bin/arm64-v8a/tun2socks bin/arm64-v8a/hev-socks5-tunnel \
                   webroot/index.html; do
            echo "$list" | grep -qx "$f" || { echo "❌ missing: $f"; exit 1; }
          done
          if echo "$list" | grep -qE 'bin/(x86_64|armeabi|arm/)|sing-box'; then
            echo "❌ unexpected ABI or sing-box payload"; exit 1
          fi
          ls -lh "$zip"

      - name: Commit the version bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add module/module.prop update.json CHANGELOG.md
          if git diff --cached --quiet; then
            echo "nothing to commit — version, update.json and changelog already current"
          else
            git commit -m "chore(release): ${{ steps.bump.outputs.version }}"
            git push origin "HEAD:${{ github.ref_name }}"
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.bump.outputs.version }}
          name: Kasumi Proxy ${{ steps.bump.outputs.version }}
          generate_release_notes: true
          files: build/*.zip
