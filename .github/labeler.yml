# Path-based PR labels (actions/labeler v5). Maps changed files to the same
# taxonomy as the PR template's "Affected layer" labels.

frontend:
  - changed-files:
      - any-glob-to-any-file:
          - "frontend/**"
          - "package.json"
          - "bun.lock"
          - "biome.json"

backend:
  - changed-files:
      - any-glob-to-any-file:
          - "crates/**"
          - "Cargo.toml"
          - "Cargo.lock"

"platform:android":
  - changed-files:
      - any-glob-to-any-file:
          - "module/**"
          - "crates/kasumi-daemon/**"

ci:
  - changed-files:
      - any-glob-to-any-file:
          - ".github/**"

documentation:
  - changed-files:
      - any-glob-to-any-file:
          - "**/*.md"
